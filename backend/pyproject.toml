[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankreporter-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "pyyaml>=6",
  "pydantic>=2",
  "psycopg[binary]>=3.1",
  "pymysql>=1.1",
  "faker==40.43.0",   # pinned: same seed must give the same names on every machine
  "fastapi==0.115.14",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "cryptography>=43",
  "fastembed==0.4.2",
  "openai==1.109.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
markers = [
  "db: needs docker compose databases (skipped if unreachable)",
  "embed: needs the local embedding model (downloaded on first use; skipped if unavailable)",
  "llm: calls the live OpenAI API (skipped without OPENAI_API_KEY)",
]

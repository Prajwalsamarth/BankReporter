[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankreporter-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "pyyaml>=6",
  "pydantic>=2",
  "psycopg[binary]>=3.1",
  "pymysql>=1.1",
  "faker>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
markers = ["db: needs docker compose databases (skipped if unreachable)"]
